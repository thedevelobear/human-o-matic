# Roland TR-6S, from drumverter's note map of it (ADRs 0137 and 0138), at its source's commit
# a627bacb4adf. Each name is drumverter's, read into the vocabulary, so it is medium confidence.
# Where an articulation has several notes, the first is the one written and the others are only
# read. A note left out is asked about. Built by tools/drumverter_maps.py: change it there and build
# it again, rather than editing this file.
schema = 1
id = "roland-tr-6s"
name = "Roland TR-6S"

# Default map: drumverter's roland_tr6s, Roland TR-6S. 12 notes, of which 12 are named here as 6
# articulations.

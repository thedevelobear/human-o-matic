# GGD Groove Player and MIDI packs, from drumverter's note map of it (ADRs 0137 and 0138), at its
# source's commit a627bacb4adf. Each name is drumverter's, read into the vocabulary, so it is medium
# confidence. Where an articulation has several notes, the first is the one written and the others
# are only read. A note left out is asked about. Built by tools/drumverter_maps.py: change it there
# and build it again, rather than editing this file.

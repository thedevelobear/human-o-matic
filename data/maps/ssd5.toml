# Each name is drumverter's, read into the vocabulary, so it is medium confidence. Where an
# articulation has several notes, the first is the one written and the others are only read. A note
# left out is asked about. Built by tools/drumverter_maps.py: change it there and build it again,
# rather than editing this file.

# The `tight` style, written by `tools/calibrate.py fit` from performed MIDI: aggregate statistics
# only (ADRs 0007, 0044). The velocities are fitted once and shared by the three styles (ADR
# 0065), and the timing is this style's band's, by tempo band. Values a performance can't give
# keep the placeholder's, and so do the rider gap, accent and fill crescendo, whose fits run
# against Appendix A or ADR 0052's tests (ADR 0068), and the riders' noise, whose fit would blur
# their alternation (ADR 0076). Don't edit it: change the fit and run it again.
name = "tight"
placeholder = false
noise_sd = 5.03
rider_noise_sd = 2.5
feet = 3.0
rider_gap = [4.0, 14.0]
rider_groove = [0.6, 0.8]
rider_flip = 0.775
accent = [2.0, 6.0]
soft = [28.0, 38.29]
soft_mix = [0.6, 0.2, 0.2]
soft_sd = 7.99
fill_metric = [2.29, 0.0, -0.83, -1.68]
fill_hand = 2.0
fill_shift = 6.0
fill_crescendo = 11.0
snare_loudness = 4.0
arc_span = 0.15
energy_drift_sd = 2.0
energy_drift_quarters = 64.0
drift_sd = 2.5
drift_quarters = [16.0, 64.0, 256.0]
tempo_cuts = [150.0]
feel_ms = [1.0, 0.8]


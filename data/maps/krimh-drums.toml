# Krimh Drums, from the instrument's own mapping page, its "Mapping Preset" for Krimh Drums, as
# the owner read it there (ADR 0139): 51 notes, of which 50 are named here as 44 articulations.
# Its note names count C3 as note 60, so its main kick, C0, is note 24. Where an articulation has
# several notes, the first is the one written and the others are only read, as the page's second
# notes are. Confidence is high where the page's name gives the canonical name directly, and medium
# where it had to be interpreted. A hat with more open degrees than the vocabulary's quarter, half,
# three quarters and fully open takes each at the nearest of them. Note 37, the page's Tom FX, is
# left out until where it sits among the toms is known, and so is note 17, which the page gives to
# the hat pedal's controller, so a note on either is asked about.
schema = 1
id = "krimh-drums"
name = "Krimh Drums"

[[kits]]
id = "default"
name = "Default map"

  [[kits.articulations]]
  name = "kick.hit"
  notes = [24, 22]
  source = "mapping"
  confidence = "high"


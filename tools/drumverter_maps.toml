# The built-in maps that come from drumverter's note maps (ADRs 0137 and 0138), which
# tools/drumverter_maps.py builds. drumverter's source is MIT-licensed, its notice in
# data/maps/NOTICE.md. Each library names its kits, each from one of drumverter's engines by its id.
# A library's `maker` is what its maker publishes about its notes, which wins over drumverter's.

# drumverter's source at one commit, as GitHub serves its archive.
[source]
name = "drumverter"
version = "a627bacb4adfb5d079bf2cd0ad5bffa9b1785d50"
url = "https://github.com/nullcrimson/remidi/archive/a627bacb4adfb5d079bf2cd0ad5bffa9b1785d50.tar.gz"
sha256 = "fda739cd762a90ca0498bfca078b7e252cd5a45d08a3e7ddb95eae4c6a575ad1"

[[libraries]]
id = "addictive-drums-2"
name = "Addictive Drums 2"
kits = [
  { id = "default", name = "Default map", engine = "addictive_drums2" },
]

[libraries.maker]
document = "XLN Audio's Addictive Drums 2 keymap"
high = [36, 37, 39, 42, 48, 61, 63, 65, 66, 67, 68, 69, 70, 71, 72, 75, 85, 87]

[libraries.maker.leave_out]
3 = "Ride 2's position controller"
4 = "Ride 1's position controller"
6 = "the snare's position controller"
41 = "the snare's shallow rimshot"
43 = "the snare's shallow hit"

[[libraries]]
id = "ezdrummer-3"

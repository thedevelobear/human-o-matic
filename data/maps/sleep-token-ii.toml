# Sleep Token II, from the library's own note mapping (ADR 0011): 68 pitches on channel 10 as 58
# articulations. Where an articulation has two notes, the first is the one written and the
# second is only read. Confidence is high where the mapping's name gives the canonical name
# directly, and medium where it had to be interpreted.
schema = 1
id = "sleep-token-ii"
name = "Sleep Token II"

[[kits]]
id = "default"
name = "Default map"
channel = 10


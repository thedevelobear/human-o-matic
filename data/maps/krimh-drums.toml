# Krimh Drums, from the library's own note mapping (ADR 0055): 52 notes, of which 50 are named
# here as 44 articulations. The mapping draws its notes on a keyboard without note numbers, so
# each number rests on reading the keyboard's kick at note 36, and every entry is low confidence
# until one note is checked in the instrument. Where an articulation has several notes, the first
# is the one written and the others are only read. A hat with more open degrees than the
# vocabulary's quarter, half, three quarters and fully open takes each at the nearest of them. Two
# notes are left out, 29 and 49, until what they play is understood, so a note on them is asked
# about.
schema = 1
id = "krimh-drums"
name = "Krimh Drums"

[[kits]]
id = "default"
name = "Default map"

  [[kits.articulations]]
  name = "kick.hit"
  notes = [36, 34]
  source = "mapping"
  confidence = "low"

  [[kits.articulations]]
  name = "kick.2.hit"
  notes = [35]
  source = "mapping"
  confidence = "low"          # read as a second kick; it could be the left foot's


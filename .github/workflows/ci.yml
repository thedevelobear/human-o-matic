name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact tags only, no major tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # The private tests need local-only files that CI doesn't have (ADR 0007).
      - run: uv run pytest -m "not private"

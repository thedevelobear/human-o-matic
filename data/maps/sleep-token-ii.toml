# MixWave Sleep Token II, from the library's Cubase drum map, read in place (ADR 0011). The map
# names 68 pitches on channel 10, with no remapping, as 58 articulations. Each label is the
# map's name for the pitch. Where an articulation has two notes, the first is in the map's main
# list and is the one written, and the second sits under its "alternatives" divider, or after
# the first in the list, and is only read. Confidence is high where the map's name gives the
# canonical name directly, and medium where it had to be interpreted.
schema = 1
id = "sleep-token-ii"
name = "MixWave Sleep Token II"

[sources.drum-map]
kind = "vendor-file"
title = "MixWave Sleep Token II default Cubase drum map"
path = "~/Music/Templates/Sleep Token Songwriting Template/Cubase/_Cubase Drum Map/MixWave Sleep Token - II.drm"

[[kits]]
id = "default"
name = "Default map"
channel = 10


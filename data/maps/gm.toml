# General MIDI, from the General MIDI Level 1 percussion key map: notes 35 to 81 on channel 10
# (ADR 0022). Each label is the standard's name for the note. GM names no articulations, so each
# note is its own articulation, and note 40, "Electric Snare", is a second snare, as the standard
# says, not a rimshot.
schema = 1
id = "gm"
name = "General MIDI"

[sources.gm1]
kind = "standard"
title = "General MIDI Level 1 percussion key map (MMA RP-003)"

[[kits]]
id = "default"
name = "Percussion key map"

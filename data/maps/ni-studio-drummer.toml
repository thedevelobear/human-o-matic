id = "ni-studio-drummer"
name = "NI Studio Drummer"

# Default map: drumverter's ni_studiodrummer, Native Instruments Studio Drummer. 77 notes, of which
# 66 are named here as 46 articulations. Left out: percussion, 27, 28, 29, 30; snare side, 40, 84,

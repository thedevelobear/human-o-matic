# Logic Pro Drums, from the GM Standard input mapping of Drum Kit Designer that Apple's Logic Pro
# User Guide publishes (ADR 0135): 30 notes, of which 29 are named here as 27 articulations. Its
# note names count C3 as note 60. Where an articulation has two notes, the first is the one written
# and the second is only read. Confidence is high where the mapping's name gives the canonical name
# directly, and medium where it had to be interpreted. Note 32, a rimshot on the snare's edge, is
# left out until the vocabulary has a name for it, so a note on it is asked about, and note 55,
# which the mapping leaves blank, is left out too.
schema = 1
id = "logic-pro-drums"
name = "Logic Pro Drums"

[[kits]]
id = "default"
name = "Default map"

  [[kits.articulations]]
  name = "kick.hit"
  notes = [36, 35]
  source = "mapping"
  confidence = "high"


# GGD Matt Halpern Signature Pack (ADR 0055). No note mapping of the library is at hand, so each
# name is inferred from where the library puts its notes, and each entry is low confidence until
# it is checked in the instrument (ADR 0025). Most notes are at General MIDI's places. A note with
# too little behind a name is left out, so a note on it is asked about.

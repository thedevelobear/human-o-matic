# What tools/build_site.py downloads for the site's engine, each at an exact version and checked
# by its SHA-256 before it is used (ADRs 0004 and 0100). The browser loads them from the site's
# own origin, never from where they were downloaded. Upgrade Pyodide and numpy together, and the
# fixed hash of tests/web/flow.json tells whether the bytes still match (ADR 0100).

# Pyodide's core release, from its GitHub release, whose SHA-256 GitHub publishes as the asset's
# digest. The build takes the runtime's files from it.
[pyodide]
version = "314.0.7"
url = "https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-core-314.0.7.tar.bz2"
sha256 = "2abdcc2e35208af406e07724cffa85bc582ced97e9028383ecf5462541393f95"
files = [
  "pyodide.mjs",
  "pyodide.asm.mjs",
  "pyodide.asm.wasm",
  "python_stdlib.zip",
  "pyodide-lock.json",
]

# Pyodide's own numpy, from its CDN, whose SHA-256 the release's pyodide-lock.json also gives.
# It sits beside pyodide-lock.json, where Pyodide loads it by name and checks it again.
[[packages]]
name = "numpy"
version = "2.4.6"
url = "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/numpy-2.4.6-cp314-cp314-pyemscripten_2026_0_wasm32.whl"
sha256 = "a292c1f5d7d8a2208cd5e94fc467604c131cabcd2fc14fed6eefde121e7fabdf"

# The other wheels, from PyPI, at uv.lock's versions, with the SHA-256s PyPI publishes:
# pydantic-core's WebAssembly wheel for Pyodide's ABI, and pure Python wheels.

    <path d="M26.5 41.5C27.5 42.8 29.5 42.8 30.5 41.5" stroke="#141218" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="48.5" r="1.8" fill="#141218"/>
    <circle cx="38" cy="48.5" r="1.8" fill="#141218"/>
    <rect x="14" y="52" width="28" height="8" rx="2.5" fill="#F7F3EB" stroke="#141218" stroke-width="2.6"/>
    <line x1="18" y1="55.5" x2="29" y2="55.5" stroke="#141218" stroke-width="2" stroke-linecap="round"/>
    <rect x="33" y="54.5" width="4" height="2.5" rx="0.8" fill="#52B788" stroke="#141218" stroke-width="1"/>
